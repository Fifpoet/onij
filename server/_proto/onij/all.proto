syntax = "proto3";

package onij;

option go_package = "api";

import "api.proto";
import "all_enum.proto";
import "all_model.proto";

// 上传文件
message UploadFileReq {
  string filename = 1;         // 原始文件名（不含路径）
  onij.AppId app_id = 2;       // 业务模块
  repeated string folders = 3; // 自定义文件夹
  bytes file = 4;              // 文件内容
}
message UploadFileResp {
  int32 code = 1;
  string message = 2;
  int32 file_id = 3;
  string file_url = 4;
}

// 上传音乐
message UploadMusicReq {
  // 基础信息
  string name = 1;
  repeated int64 artist_ids = 2;
  int64 mp3_file_id = 3;
  int64 lyrics_file_id = 4;

  // 表单信息
  optional int64 composer_id = 10;
  optional int64 writer_id = 11;
  optional int64 album_id = 12;
  optional string mv_url = 13;
  optional int64 root_music_id = 14;
  optional int32 issue_time = 15;

  // update
  optional int64 music_id = 50;
}
message UploadMusicResp {
  int32 code = 1;
  string message = 2;
  int32 music_id = 3;
}

message UploadArtistReq {
  string name = 1;
  onij.ArtistType artist_type = 2;
}
message UploadArtistResp {
  int32 code = 1;
  string message = 2;
  int32 artist_id = 3;
}

// 上传专辑
message UploadAlbumReq {
  string name = 1;
  int64 artist_id = 2;
  string cover_file_id = 3;
  int32 issue_time = 4;
  optional int64 music_id = 5;
}
message UploadAlbumResp {
  int32 code = 1;
  string message = 2;
  int32 album_id = 3;
}

// 获取音乐详情
message GetMusicDetailReq { int32 music_id = 1; }
message GetMusicDetailResp {
  int32 code = 1;
  string message = 2;
  MusicDetail detail = 3;
}

// 获取专辑详情
message GetAlbumDetailReq { int32 album_id = 1; }
message GetAlbumDetailResp {
  int32 code = 1;
  string message = 2;
  AlbumDetail detail = 3;
}

service AllService {
  // 上传文件
  rpc UploadFile(UploadFileReq) returns (UploadFileResp) {
    option (api.post) = "/file/upload";
  }
  // 上传音乐
  rpc UploadMusic(UploadMusicReq) returns (UploadMusicResp) {
    option (api.post) = "/music/upload";
  }
  // 上传专辑
  rpc UploadAlbum(UploadAlbumReq) returns (UploadAlbumResp) {
    option (api.post) = "/album/upload";
  }
  // 获取音乐详情
  rpc GetMusicDetail(GetMusicDetailReq) returns (GetMusicDetailResp) {
    option (api.get) = "/music/detail";
  }
  // 获取专辑详情
  rpc GetAlbumDetail(GetAlbumDetailReq) returns (GetAlbumDetailResp) {
    option (api.get) = "/album/detail";
  }
}
