[project]
name = "onij-uvr-api"
version = "0.1.0"
description = "HTTP API for Ultimate Vocal Remover (instrumental extraction on Windows)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "audio-separator>=0.30.0",
]

[project.scripts]
uvr-api = "app.main:run"

[tool.uv]
dev-dependencies = []
