<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐信息提取器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>音乐信息提取器</h1>
      <div class="status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">监听中...</span>
      </div>
    </header>

    <div class="controls">
      <button id="clearBtn" class="btn btn-secondary">清空列表</button>
      <button id="refreshBtn" class="btn btn-primary">刷新</button>
    </div>

    <div class="content">
      <div class="list-header">
        <h2>捕获的请求</h2>
        <span class="count" id="requestCount">0 条</span>
      </div>
      
      <div class="list-container">
        <div id="requestList" class="request-list">
          <div class="empty-state">
            <p>暂无捕获的请求</p>
            <p class="hint">访问 https://zm.i9mr.com/song/detail 开头的页面来测试</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
