<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐爬取助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>音乐爬取助手</h1>
      <div class="filter-controls">
        <input type="text" id="urlFilter" placeholder="输入URL前缀过滤请求" />
        <button id="clearFilter">清除过滤</button>
      </div>
    </div>
    
    <div class="content">
      <div class="request-list" id="requestList">
        <!-- 请求列表项将在这里动态生成 -->
      </div>
      
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎵</div>
        <p>暂无匹配的请求</p>
        <p class="empty-hint">请在上方输入URL前缀来过滤请求</p>
      </div>
    </div>
  </div>

  <!-- 录入表单弹框 -->
  <div class="modal" id="entryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>录入音乐信息</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="entryForm">
          <div class="form-group">
            <label for="songName">歌曲名称 *</label>
            <input type="text" id="songName" required />
          </div>
          
          <div class="form-group">
            <label for="albumName">专辑名称 *</label>
            <input type="text" id="albumName" required />
          </div>
          
          <div class="form-group">
            <label for="artistName">艺术家名称</label>
            <input type="text" id="artistName" />
          </div>
          
          <div class="form-group">
            <label for="duration">时长 (秒)</label>
            <input type="number" id="duration" min="0" />
          </div>
          
          <div class="form-group">
            <label for="fileUrl">文件URL</label>
            <input type="url" id="fileUrl" />
          </div>
          
          <div class="form-group">
            <label for="coverUrl">封面URL</label>
            <input type="url" id="coverUrl" />
          </div>
          
          <div class="form-group">
            <label for="lyrics">歌词</label>
            <textarea id="lyrics" rows="4"></textarea>
          </div>
          
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelEntry">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
