version: '3.8'

services:
  # Go 服务
  mysql:
    image: m.daocloud.io/docker.io/library/mysql:8.0
    container_name: mysql_container
    ports:
      - "3306:3306" # 将主机的3306端口映射到容器的3306端口
    environment:
      MYSQL_ROOT_PASSWORD: "zc1669" # 设置MySQL root用户密码
      MYSQL_DATABASE: "footprint"         # 创建默认数据库
    volumes:
      - ~/vol/mysql:/var/lib/mysql # 持久化数据
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app-network
  go-backend:
    build:
      context: ./server/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network  # 定义一个网络，用于容器间通信
    depends_on:
      - mysql # 确保MySQL服务启动后再启动后端
    environment:
       sk: "8QkUop7Wx7pZ95quVkSYo1MdHCZudCdhO0NC5Mlq"
       mypwd: "zc1669"
       ip: "mysql"
       GOPROXY: "https://goproxy.cn,direct"

  node-service:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "18968:18968"
    networks:
      - app-network  # 使用同一网络
    environment:
      VITE_SERVER_URL: "http://go-backend:8080/"  # Vue 应用访问 Go 服务的 URL，使用服务名称作为主机名

networks:
  app-network:
    driver: bridge  # 使用桥接网络进行容器间通信
