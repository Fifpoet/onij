# onij.fun — HTTP 保留 ACME；HTTPS 提供站点 + /go（主站 API）+ /netease（网易代理）
# 由 scripts/remote_enable_https.py 同步到 /etc/nginx/conf.d/web-vue.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name onij.fun www.onij.fun _;

    root /var/www/onij/web;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        return 301 https://onij.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.onij.fun;
    ssl_certificate     /etc/letsencrypt/live/onij.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onij.fun/privkey.pem;
    return 301 https://onij.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onij.fun;

    ssl_certificate     /etc/letsencrypt/live/onij.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onij.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/onij/web;
    index index.html;
    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location ^~ /cdn/ {
        resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        set $qiniu_cdn cloud.onij.fun;
        rewrite ^/cdn/(.*)$ /$1 break;
        proxy_pass http://$qiniu_cdn;
        proxy_http_version 1.1;
        proxy_set_header Host cloud.onij.fun;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /go/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /netease/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public,max-age=2592000";
    }

    location ~* \.html$ {
        expires -1;
    }
}
